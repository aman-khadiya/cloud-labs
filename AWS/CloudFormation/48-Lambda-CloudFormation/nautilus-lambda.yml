AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to deploy an AWS Lambda function and IAM execution role

Resources:

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lambda_execution_role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  NautilusLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: nautilus-lambda
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 256
      Timeout: 10

      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  "statusCode": 200,
                  "body": "Welcome to KKE AWS Labs!"
              }

Outputs:

  LambdaFunctionName:
    Description: Name of the Lambda Function
    Value: !Ref NautilusLambda

  LambdaFunctionArn:
    Description: ARN of the Lambda Function
    Value: !GetAtt NautilusLambda.Arn

  LambdaExecutionRole:
    Description: IAM Role used by the Lambda Function
    Value: !Ref LambdaExecutionRole